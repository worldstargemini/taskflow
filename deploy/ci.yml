# Copy to .github/workflows/ci.yml in Phase 4.
# Runs on every pull request. Make the "test" check required in branch protection.
name: CI

on:
  pull_request:
  workflow_call:   # lets deploy.yml reuse this exact job

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
